name: WDK Diagnostics

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Find driver toolset
        shell: powershell
        run: |
          "=== Windows Kits top level ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          "=== WDK props anywhere in VS ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Recurse -Filter '*KernelModeDriver*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== WDK-ish files under Windows Kits ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter '*KernelModeDriver*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== VS extensions mentioning driver ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'Driver|WDK' } |
            Select-Object -ExpandProperty FullName
          "=== Installed Roots ==="
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue |
            Format-List

      - name: Build
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Build.ps1 -Configuration Release
