name: WDK Diagnostics

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Inspect INF verification tooling
        shell: powershell
        run: |
          $kits = "${env:ProgramFiles(x86)}\Windows Kits\10"
          "=== InfVerif under Tools ==="
          Get-ChildItem "$kits\Tools" -Recurse -Filter 'InfVerif*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== InfVerif under build ==="
          Get-ChildItem "$kits\build" -Recurse -Filter 'InfVerif*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== WindowsDriver.common.targets around line 692 ==="
          Get-Content "$kits\build\10.0.26100.0\WindowsDriver.common.targets" |
            Select-Object -Skip 660 -First 50

      - name: Build
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Build.ps1 -Configuration Release
