name: WDK Diagnostics

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Inspect WDK installation
        shell: powershell
        run: |
          "=== SDK include versions ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Select-Object -ExpandProperty Name
          "=== ntddk.h locations ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Recurse -Filter ntddk.h -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== Driver platform toolsets ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name
          "=== WDK props/targets in VS ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170" -Recurse -Filter '*wdk*' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Build with detailed log
        shell: powershell
        run: |
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild .\TempModFilter.sln /m /p:Configuration=Release /p:Platform=x64 /v:diag *> diag.log
          "exit=$LASTEXITCODE"
          "=== resolved values ==="
          Select-String -Path diag.log -Pattern 'WindowsTargetPlatformVersion =|WindowsSDKVersion =|WDKContentRoot =|WDKVersion =|IncludePath =' |
            Select-Object -First 30 | ForEach-Object { $_.Line.Trim() }
          "=== ntddk mentions ==="
          Select-String -Path diag.log -Pattern 'ntddk|km\\|\\km;' |
            Select-Object -First 20 | ForEach-Object { $_.Line.Trim() }
          "=== include dirs from cl ==="
          Select-String -Path diag.log -Pattern 'AdditionalIncludeDirectories|IncludePath>' |
            Select-Object -First 20 | ForEach-Object { $_.Line.Trim() }
