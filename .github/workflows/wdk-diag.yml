name: WDK Diagnostics

on:
  push:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Locate WDK files
        shell: powershell
        run: |
          "=== VSIX files ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter *.vsix -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== VSIXInstaller ==="
          Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" -Filter 'vsixinstaller.exe' -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          "=== Platform toolsets before ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Install WDK VS extension
        shell: powershell
        run: |
          $vsix = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter *.vsix -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'VS2022' } | Select-Object -First 1
          if (-not $vsix) { Write-Host 'NO VS2022 VSIX FOUND'; exit 1 }
          Write-Host "Installing $($vsix.FullName)"
          $installer = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer" -Filter 'vsixinstaller.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          & $installer.FullName /quiet /admin $vsix.FullName
          Write-Host "vsixinstaller exit=$LASTEXITCODE"
          "=== Platform toolsets after ==="
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Microsoft\VC\v170\Platforms\x64\PlatformToolsets" -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

      - name: Build
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Build.ps1 -Configuration Release
