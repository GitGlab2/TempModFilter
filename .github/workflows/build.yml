name: Build TempModFilter Driver

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Driver and Client (Release x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Driver + Client)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Build.ps1 -Configuration Release

      - name: Sign Driver with Test Certificate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\package -Force | Out-Null
          powershell -ExecutionPolicy Bypass -File .\scripts\Sign-Test.ps1 -CerOutPath .\package\TempModFilter.cer

      - name: Prepare Release Package
        shell: powershell
        run: |
          $packageDir = ".\package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          # Copy driver binary and INF
          Copy-Item ".\build\Release\x64\driver\*" $packageDir -Recurse -Force
          # Copy user client binary
          Copy-Item ".\build\Release\x64\user\FilterClient.exe" $packageDir -Force
          # Copy installation scripts
          Copy-Item ".\scripts\Install.ps1" $packageDir -Force
          Copy-Item ".\scripts\Uninstall.ps1" $packageDir -Force
          Copy-Item ".\scripts\Test-RoundTrip.ps1" $packageDir -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TempModFilter-Release-x64
          path: .\package\

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: TempModFilter-Release-x64
          path: package

      - name: Create the release archive
        run: |
          cd package
          zip -r "../TempModFilter-${GITHUB_REF_NAME}-x64.zip" .

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            v0.*) prerelease="--prerelease" ;;
          esac

          cat > notes.md <<'EOF'
          TEST-SIGNED BUILD - LAB / VM ONLY.

          - Install on a test VM, never on a production host.
          - Run `bcdedit /set testsigning on` and disable Secure Boot.
          - `Install.ps1` trusts the bundled `TempModFilter.cer` automatically.

          Built from commit ${{ github.sha }} by workflow run ${{ github.run_id }}.
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            "TempModFilter-${GITHUB_REF_NAME}-x64.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag \
            ${prerelease}
