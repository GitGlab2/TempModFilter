name: Build TempModFilter Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Driver and Client (Release x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution (Driver + Client)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Build.ps1 -Configuration Release

      - name: Sign Driver with Test Certificate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\package -Force | Out-Null
          powershell -ExecutionPolicy Bypass -File .\scripts\Sign-Test.ps1 -CerOutPath .\package\TempModFilter.cer

      - name: Prepare Release Package
        shell: powershell
        run: |
          $packageDir = ".\package"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          
          # Copy driver binary and INF
          Copy-Item ".\build\Release\x64\driver\*" $packageDir -Recurse -Force
          # Copy user client binary
          Copy-Item ".\build\Release\x64\user\FilterClient.exe" $packageDir -Force
          # Copy installation scripts
          Copy-Item ".\scripts\Install.ps1" $packageDir -Force
          Copy-Item ".\scripts\Uninstall.ps1" $packageDir -Force
          Copy-Item ".\scripts\Test-RoundTrip.ps1" $packageDir -Force

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TempModFilter-Release-x64
          path: .\package\
